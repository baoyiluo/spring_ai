app:
  ai:
    provider: google # or OpenAI
spring:
  application:
    name: first-ai-project
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.7
    openai:
      api-key: dummy
      base-url: http://localhost:12434/engines/llama.cpp
      chat:
        options:
          model: gemma3
