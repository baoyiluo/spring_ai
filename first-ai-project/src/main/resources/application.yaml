    vertex:
      ai:
        gemini:
          project-id: product-id
          location: us-central1
          chat:
            options:
              model: gemini-2.0-flash
    huggingface:
      chat:
        api-key: ${HUGGINGFACE_API_KEY}
        url: https://router.huggingface.co
        options:
          model: Qwen/Qwen2.5-Coder-7B-Instruct:nscale # Qwen3-Coder-30B-A3B-Instruct # facebook/bart-large-cnn
          max-new-token: 1024
          temperature: 0.7
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: mistral:7b
#          max-new-tokens: 512
