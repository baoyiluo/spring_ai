logging:
  level:
    root: INFO
    com:
      jialli:
        first_ai_project: INFO
    org.springframework.ai: INFO
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG #OFF
server:
  port: 8081