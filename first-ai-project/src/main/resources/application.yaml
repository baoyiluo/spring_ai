app:
  ai:
    provider: google # or OpenAI
  agent:
    upload-dir: /Users/jialli/Documents/spring_ai/agent-files/uploads
    diagram-tool:
      temperature: 0.2

  rag:
    force-rebuild: true
    top-k: 20
    similarity-threshold: 0.0 # re-ranker will filter out the relevant docs
    radius: 1
    chunk:
      size: 100
      min-chunk-size: 200
      min-chunk-to-embed: 50
      max-num-chunks: 8192
      keep-separator: true
    pdf:
      mode: page #paragraph
      path: file:/Users/jialli/rag-files/qa-over-internal-docs/*.pdf #classpath: rag/qa-over-internal-docs/*.pdf
      pages-per-document: 1
      left-alignment: true
      number-of-top-text-lines-to-delete: 0
      number-of-bottom-text-lines-to-delete: 0
    query-expander:
      number-of-queries: 4
    rerank:
      url: "https://api.cohere.com/v2/rerank"
      api-key: ${COHERE_API_KEY}
      model: "rerank-english-v3.0"
      top-n: 6
    synonyms:
      PTO: "paid time off"
      SSO: "single sign-on"
      MFA: "multi-factor authentication"
      2FA: "two-factor authentication"
      IaC: "infrastructure as code"
      PII: "personal data"
      CI/CD: "continuous integration and delivery"
      NAT: "network address translation"
      GDPR: "data protection regulation"
      VPN: "virtual private network"
      SDLC: "software development lifecycle"
      DNS: "domain name system"
      IP: "internet protocol"
      API: "application programming interface"
      SDK: "software development kit"
      UI: "user interface"
      UX: "user experience"
      DB: "database"
      SQL: "structured query language"
      NoSQL: "non-relational database"
      OS: "operating system"
      SSH: "secure shell"
      HTTP: "hypertext transfer protocol"
      HTTPS: "secure hypertext transfer protocol"
spring:
  application:
    name: first-ai-project
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      pgvector:
        table-name-for-chat-memory: vector_store
        table-name-for-rag: rag_vector_store
        initialize-schema: true
        index-type:  NONE # HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        max-document-batch-size: 10_000
    google:
      genai:
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            options:
              model: gemini-embedding-001

        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.7
    openai:
      api-key: dummy
      base-url: http://localhost:12434/engines/llama.cpp
      chat:
        options:
          model: gemma3
      embedding:
        options:
          model: ai/mxbai-embed-large
